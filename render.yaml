services:
  - type: web
    name: veera-magicpin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    # Single instance on purpose: the context store is in-memory, so state must
    # not be split across replicas (the challenge expects one persistent process).
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
